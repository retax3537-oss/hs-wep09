<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · 켜는 곳은 자식이 아니라 부모입니다</title>
  <style>
    /* 결과 화면(body) 전체 배경색을 보라색으로 설정 */
    body {
      background-color: #6a0dad; /* 진한 보라색 (원하는 색상 코드로 변경 가능합니다) */
      color: #ffffff;            /* 배경이 어두우므로 글자색을 하얗게 설정 */
    }

    /*
    9주차 예제 1 — 켜는 곳은 자식이 아니라 부모입니다
    */
    .container {        /* ← 부모(flex container)에 선언 */
      display: flex;
    }
    /* .container의 자식들(flex item)이 자동으로 가로로 늘어섭니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>
  <ul>
    <li>Ai sw학 </li>
    <li>202678112 </li>
    <li>이주현</li>
  </ul>
  <div class="box">div.box</div>
  <button>버튼</button>
</body>
</html>
